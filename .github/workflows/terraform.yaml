name: Terraform

on:
  pull_request:
    paths:
      - "infrastructure/**"

  push:
    branches:
      - main
    paths:
      - "infrastructure/**"

permissions:
  contents: read

jobs:

  validate:

    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/oracleCloud/environments/develop

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci

          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Check variables
        run: |
          echo "Compartment:"
          echo $TF_VAR_compartment_ocid

          echo "Region:"
          echo $TF_VAR_region

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -lock=false
        env:
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_github_token: ${{ secrets.FLUX_GITHUB_TOKEN }}
          TF_LOG: DEBUG

  apply:

    name: Terraform Apply
    needs: validate
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: develop

    outputs:
      cluster_id: ${{ steps.cluster.outputs.cluster_id }}

    defaults:
      run:
        working-directory: infrastructure/oracleCloud/environments/develop

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci

          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -target=module.networking -target=module.oke -target=module.loadbalancer
        env:
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_github_token: ${{ secrets.FLUX_GITHUB_TOKEN }}

      - name: Get cluster ID
        id: cluster
        run: |
          echo "cluster_id=$(terraform output -raw cluster_id)" >> $GITHUB_OUTPUT

  fluxcd-bootstrap:
    name: FluxCD Bootstrap
    needs: apply
    runs-on: ubuntu-latest
    environment: develop
    defaults:
      run:
        working-directory: infrastructure/oracleCloud/environments/develop
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          # 1. Download and run the automated installer natively
          bash -c "$(curl -L https://githubusercontent.com)" -- \
            --accept-all-defaults

          # 2. FIX: Force-inject the newly compiled path straight into the GitHub Actions system path array
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      # Fix: The OCI CLI must be explicitly re-configured for this separate runner agent
      # because it needs to generate your dynamic session tokens
      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF

      - name: Terraform Init
        run: terraform init

      # STAGE 2: Dynamically grab values straight from the freshly created state file 
      - name: Open Dynamic Secure OCI Bastion Tunnel
        run: |
          CLUSTER_PRIVATE_IP=$(terraform output -raw cluster_private_ip)
          BASTION_OCID=$(terraform output -raw bastion_id)
          
          echo "Connecting securely to dynamically allocated cluster IP: $CLUSTER_PRIVATE_IP"
          
          ssh-keygen -t ed25519 -N "" -f ./id_bastion
          
          SESSION_OCID=$(oci bastion session create-port-forwarding \
            --bastion-id $BASTION_OCID \
            --display-name "pipeline-dynamic-session" \
            --key-details '{"publicKeyContent": "'"$(cat ./id_bastion.pub)"'"}' \
            --target-private-ip-id "$CLUSTER_PRIVATE_IP" \
            --target-port 6443 \
            --query "data.id" --raw-output)
          
          sleep 15
          
          ssh -i ./id_bastion -o StrictHostKeyChecking=no -N -L 6443:${CLUSTER_PRIVATE_IP}:6443 -p 22 \
            $SESSION_OCID@host.bastion.${{ secrets.OCI_REGION }}.oci.oraclecloud.com &
          
          sleep 5

      # STAGE 3: Final execution. Safely hooks FluxCD over the active tunnel
      - name: Terraform Apply Full Workspace
        run: terraform apply -auto-approve
        env:
          TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          TF_VAR_use_tunnel: "true"
          TF_VAR_github_token: ${{ secrets.FLUX_GITHUB_TOKEN }}
          TF_VAR_github_org_or_username: "Forbzy"
          TF_VAR_github_repository_name: "cloudbills-fluxcd"
